<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project GPT OS Register</title><style>body{font:16px system-ui;background:#f7f8f5;color:#173a30;max-width:1000px;margin:auto;padding:2rem}main{background:white;padding:2rem;border-radius:18px}input{padding:12px;border:1px solid #aaa;border-radius:8px;max-width:100%;box-sizing:border-box}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid #ddd;overflow-wrap:anywhere}a{color:#14684d}</style><main><h1>Project GPT OS</h1><p>Read-only source register. Load a trusted JSON export; no data leaves your browser.</p><input type="file" id="upload" accept="application/json"> <input id="filter" placeholder="Search provider, name or ID"><p id="count">No inventory loaded</p><div style="overflow-x:auto"><table><thead><tr><th>Provider</th><th>Name</th><th>ID</th><th>Location</th></tr></thead><tbody id="rows"></tbody></table></div><p>Accepts an array of sources or a sync report containing proposed sources.</p></main><script>
let items=[];const el=id=>document.getElementById(id);
function render(){let q=el('filter').value.toLowerCase(),found=items.filter(x=>JSON.stringify(x).toLowerCase().includes(q));el('count').textContent=found.length+' of '+items.length+' sources';el('rows').replaceChildren(...found.map(x=>{let row=document.createElement('tr');for(let key of ['provider','name','external_id']){let cell=document.createElement('td');cell.textContent=x[key]||'';row.append(cell)}let cell=document.createElement('td');if(x.external_url&&/^https:\/\//.test(x.external_url)){let a=document.createElement('a');a.href=x.external_url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Open';cell.append(a)}else cell.textContent=x.source_path||'';row.append(cell);return row}))}
el('upload').onchange=async e=>{try{let payload=JSON.parse(await e.target.files[0].text());items=Array.isArray(payload)?payload:(payload.proposed||[]);render()}catch(error){items=[];render();el('count').textContent='Invalid JSON'}};el('filter').oninput=render;</script></html>
