<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project GPT OS — Registry</title>
<style>
:root{color-scheme:light}body{margin:0;background:#f5f7f4;color:#183a30;font:15px system-ui,Arial,sans-serif}.shell{max-width:1150px;margin:auto;padding:30px 18px}header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}h1{font-size:28px;margin:0}.sub{color:#60746d;margin:6px 0 18px}.panel{background:white;border:1px solid #dfebe3;border-radius:15px;padding:20px;margin:16px 0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}.stat{padding:17px;border-radius:12px;background:#edf4ef}.stat strong{display:block;font-size:27px}.stat span{font-size:12px;color:#597168}button,input{font:inherit;padding:10px;border-radius:8px;border:1px solid #b6c9be}button{background:#fff;cursor:pointer}button[aria-selected=true]{background:#1b4939;color:white;border-color:#1b4939}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}#search{min-width:220px;flex:1}table{border-collapse:collapse;width:100%;min-width:630px}td,th{text-align:left;padding:12px;border-bottom:1px solid #e9efeb;overflow-wrap:anywhere}th{font-size:12px;color:#62776c}a{color:#0b6c48}.scroll{overflow-x:auto}.muted{color:#61796d}#notice{font-size:13px}
</style></head>
<body><div class="shell"><header><div><h1>Project GPT OS</h1><p class="sub">Project · Source · Agent / Plugin · Thread Registry</p></div><label>Load private JSON export <input type="file" id="file" accept=".json,application/json"></label></header>
<div class="panel"><div class="stats" id="stats"></div></div>
<section class="panel"><div class="tabs" role="tablist" aria-label="Registry category"><button data-tab="projects" aria-selected="true">Projects</button><button data-tab="sources" aria-selected="false">Sources</button><button data-tab="catalogue" aria-selected="false">Agents & plugins</button><button data-tab="threads" aria-selected="false">Threads</button></div><div class="controls"><input id="search" type="search" placeholder="Search current tab"><span id="count" class="muted"></span></div><p id="notice" class="muted">Load a trusted JSON export. This page is offline and never sends data to a server.</p><div class="scroll"><table><thead id="head"></thead><tbody id="body"></tbody></table></div></section>
<p class="muted">Local viewer only · No credentials required · Do not publish private export files</p></div>
<script>
'use strict';
let data={projects:[],sources:[],catalogue:[],threads:[]},tab='projects';
const $=id=>document.getElementById(id);
const fields={projects:['project_code','name','status'],sources:['provider','name','external_id','source_path'],catalogue:['item_type','item_code','name','status','version'],threads:['name','provider','external_id','status']};
function cell(row,key){const td=document.createElement('td');const val=row[key]??'';td.textContent=String(val);if(key==='name'&&row.external_url&&/^https:\/\//.test(row.external_url)){const a=document.createElement('a');a.href=row.external_url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=String(val);td.replaceChildren(a)}return td}
function render(){const all=data[tab]||[],q=$('search').value.toLowerCase(),rows=all.filter(x=>Object.values(x).some(v=>String(v??'').toLowerCase().includes(q)));$('stats').replaceChildren(...Object.entries(data).map(([name,items])=>{const d=document.createElement('div');d.className='stat';const n=document.createElement('strong');n.textContent=items.length;const t=document.createElement('span');t.textContent=name;d.append(n,t);return d}));$('head').replaceChildren();const h=document.createElement('tr');fields[tab].forEach(k=>{const th=document.createElement('th');th.textContent=k.replaceAll('_',' ');h.append(th)});$('head').append(h);$('body').replaceChildren(...rows.map(r=>{const tr=document.createElement('tr');fields[tab].forEach(k=>tr.append(cell(r,k)));return tr}));$('count').textContent=rows.length+' of '+all.length;}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));$('search').value='';render()});
$('search').oninput=render;
$('file').onchange=async e=>{try{const parsed=JSON.parse(await e.target.files[0].text());if(!parsed||typeof parsed!=='object')throw Error('Unexpected format');data={projects:Array.isArray(parsed.projects)?parsed.projects:[],sources:Array.isArray(parsed.sources)?parsed.sources:(Array.isArray(parsed)?parsed:(parsed.proposed||[])),catalogue:Array.isArray(parsed.catalogue)?parsed.catalogue:[],threads:Array.isArray(parsed.threads)?parsed.threads:[]};$('notice').textContent='Loaded local file; no data uploaded.';render()}catch(err){$('notice').textContent='Invalid registry JSON. Existing view retained.'}};
render();
</script></body></html>
