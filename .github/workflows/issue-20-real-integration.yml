name: Real Offline Module Integration
on:
  pull_request:
    paths:
      - 'portfolio/dispatcher.py'
      - 'portfolio/idea_intake.py'
      - 'portfolio/v4/**'
      - 'tests/test_real_module_integration.py'
      - '.github/workflows/issue-20-real-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF test dependency
        run: python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Execute real module integration tests
        run: python -m unittest discover -s tests -p 'test_real_module_integration.py' -v
