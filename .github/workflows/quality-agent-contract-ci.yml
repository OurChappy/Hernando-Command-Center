name: Quality Agent Contract CI
on:
  pull_request:
    paths:
      - '.github/agents/**'
      - 'governance/quality/**'
      - 'tests/test_quality_agent_pack.py'
      - '.github/workflows/quality-agent-contract-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_quality_agent_pack.py' -v
