name: Career Artifact Publisher
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without uploading
        required: true
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish and verify
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/publish_career.py
      - name: Upload execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-publishing-report
          path: publishing-report.json
          if-no-files-found: ignore
