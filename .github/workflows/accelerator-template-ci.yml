name: Accelerator Template CI
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
      - '.github/ISSUE_TEMPLATE/engineering-task.yml'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/prompts/**'
      - '.github/workflows/accelerator-template-ci.yml'
      - 'tests/test_accelerator_templates.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline template contract tests
        run: python -m unittest discover -s tests -p 'test_accelerator_templates.py' -v
