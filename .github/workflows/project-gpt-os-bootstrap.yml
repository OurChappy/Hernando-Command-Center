name: Project GPT OS — Manual Dry Run Bootstrap
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed registry implementation
        uses: actions/checkout@v7
        with:
          ref: 277eb9a09a146643176fc2c9ce7db21838f72fcf
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile and test
        run: |
          python -m compileall -q registry tests
          python -m unittest discover -s tests -p 'test_registry_*.py' -v
      - name: GitHub OIDC authenticated inventory dry run
        env:
          INVENTORY_URL: https://sbdzvjqwslwaqdqyrbfn.supabase.co/functions/v1/project-gpt-os-inventory
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          audience="project-gpt-os-registry-reader"
          request_url=os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator="&" if "?" in request_url else "?"
          url=request_url+separator+urllib.parse.urlencode({"audience":audience})
          request=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          with urllib.request.urlopen(request,timeout=20) as response:
              jwt=json.load(response)["value"]
          request=urllib.request.Request(os.environ["INVENTORY_URL"],headers={"Authorization":"Bearer "+jwt})
          with urllib.request.urlopen(request,timeout=30) as response:
              inventory=json.load(response)
          sources=inventory.get("sources")
          if not isinstance(sources,list):
              raise RuntimeError("Missing inventory sources")
          keys=[(x.get("provider"),x.get("external_id")) for x in sources]
          if len(keys)!=50 or len(set(keys))!=len(keys):
              raise RuntimeError("Inventory differs from approved 50-source baseline; review before release")
          print("OIDC verified read-only inventory: 50 unique sources.")
          PY
